<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Dictionary SPA</title>
</head>
<body>
    <div id="app">
        <h1>Dictionary Search</h1>
        <form id="searchForm" aria-label="Search for a word">
            <input type="text" id="searchInput" placeholder="Enter a word" aria-label="Word to search" required>
            <button type="submit">Search</button>
        </form>
        <div id="resultsContainer" aria-live="polite"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
